<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Comparativa de Mutantes</title>
<style>
:root {
    --bg-dark: #0f0f12;
    --card-bg: #141419;
    --panel-bg: #1c1c24;
    --accent-gold: linear-gradient(135deg, #ffd700, #ff8c00);
    --green-up: #39ff14;
    --red-down: #ff4d4d;
    --text-muted: #888899;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-dark);
    background-image: radial-gradient(circle at 50% 0%, #1d2136 0%, var(--bg-dark) 70%);
    color: #e1e1e1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

.header-bar {
    width: 100%;
    max-width: 750px;
    margin-bottom: 20px;
    text-align: center;
}

input#search {
    width: 100%;
    padding: 12px 16px;
    background: #1a1a20;
    border: 1px solid #333340;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.3s ease;
}

input#search:focus {
    border-color: #ffb700;
    box-shadow: 0 0 10px rgba(255, 183, 0, 0.2);
}

.cards-container {
    display: flex;
    flex-direction: column;
    gap: 25px;
    width: 100%;
    max-width: 750px;
}

/* ESTRUCTURA DE LA TARJETA */
.card {
    background: var(--card-bg);
    border: 1px solid #282832;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.card-body {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

/* PANELES DE STATS */
.stats-panel {
    background: var(--panel-bg);
    border: 1px solid #2a2a36;
    border-radius: 8px;
    padding: 12px 16px;
    width: 32%;
    box-sizing: border-box;
}

.panel-title {
    text-align: center;
    font-weight: bold;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    padding: 3px 6px;
    border-radius: 12px;
    background: #11131d;
    border-bottom: 1px solid #2a2a36;
}

.panel-title.now {
    background: rgba(57, 255, 20, 0.1);
    color: var(--green-up);
    border: 1px solid rgba(57, 255, 20, 0.2);
}

.stats-panel table {
    width: 100%;
    border-collapse: collapse;
}

.stats-panel td {
    padding: 4px 0;
    font-size: 13px;
}

.lbl {
    color: #aaaaee;
    font-weight: 500;
}

.val {
    text-align: right;
    font-weight: bold;
    color: #ffffff;
}

/* ESTILOS DE CAMBIOS (VERDE / ROJO / GLOW) */
.val.up {
    color: var(--green-up);
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
}

.val.down {
    color: var(--red-down);
    text-shadow: 0 0 8px rgba(255, 77, 77, 0.3);
}

/* PANEL CENTRAL DE IMAGEN */
.image-panel {
    width: 30%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.image-panel img {
    max-width: 100%;
    max-height: 220px;
    object-fit: contain;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.9));
}

/* PIE DE LA TARJETA */
.card-footer {
    text-align: center;
    margin-top: 5px;
    padding-top: 8px;
    border-top: 1px dashed #282832;
}

.mutant-name {
    font-size: 21px;
    font-weight: 900;
    background: var(--accent-gold);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.mutant-sub {
    font-size: 13px;
    color: #aaaaaa;
    margin-top: 2px;
}

.badge-tag {
    display: inline-block;
    background: #282832;
    color: #cbd5e1;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    margin-left: 2px;
}
</style>
</head>
<body>

<div class="header-bar">
    <h2>Especímenes Modificados (2)</h2>
    <input type="text" id="search" onkeyup="filterCards()" placeholder="Buscar mutante, gen o habilidad...">
</div>

<div class="cards-container" id="container">

    <!-- EJEMPLO DE TARJETA 1 -->
    <div class="card" data-search="doctor del farol necro weaken">
        <div class="card-body">
            <div class="stats-panel">
                <div class="panel-title">ANTES</div>
                <table>
                    <tr><td class="lbl">Vida:</td><td class="val">4,119</td></tr>
                    <tr><td class="lbl">Velocidad:</td><td class="val">4.76</td></tr>
                    <tr><td class="lbl">Atk 1:</td><td class="val">1,211</td></tr>
                    <tr><td class="lbl">Atk 2:</td><td class="val">1,432 <span class="badge-tag">AOE</span></td></tr>
                    <tr><td class="lbl">Habilidad:</td><td class="val">28</td></tr>
                </table>
            </div>

            <div class="image-panel">
                <img src="https://wiki.mutantsgeneticgladiators.com/images/thumb/5/52/Doctor_del_Farol.png/250px-Doctor_del_Farol.png" alt="Doctor del Farol">
            </div>

            <div class="stats-panel">
                <div class="panel-title now">AHORA</div>
                <table>
                    <tr><td class="lbl">Vida:</td><td class="val">4,119</td></tr>
                    <tr><td class="lbl">Velocidad:</td><td class="val">4.76</td></tr>
                    <tr><td class="lbl">Atk 1:</td><td class="val up">2,316 ▲</td></tr>
                    <tr><td class="lbl">Atk 2:</td><td class="val up">1,552 ▲ <span class="badge-tag">AOE</span></td></tr>
                    <tr><td class="lbl">Habilidad:</td><td class="val">48</td></tr>
                </table>
            </div>
        </div>

        <div class="card-footer">
            <div class="mutant-name">Doctor del Farol</div>
            <div class="mutant-sub">Necro / Necro • Habilidad: <b>Weaken</b></div>
        </div>
    </div>

</div>

<script>
function filterCards() {
    let q = document.getElementById('search').value.toLowerCase();
    let cards = document.querySelectorAll('.card');
    cards.forEach(card => {
        let text = card.getAttribute('data-search');
        card.style.display = text.includes(q) ? 'flex' : 'none';
    });
}
</script>

</body>
</html>
